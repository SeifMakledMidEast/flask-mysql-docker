name: Container CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

concurrency:
  group: container-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    env:
      APP_IMAGE: flask-mysql-app
      DB_IMAGE: flask-mysql-db

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image namespace
        run: echo "IMAGE_NAMESPACE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Flask image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MySQL image
        uses: docker/build-push-action@v6
        with:
          context: ./database
          file: ./database/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ env.DB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Flask image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/${{ env.APP_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan MySQL image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/${{ env.DB_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag images for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag "$IMAGE_NAMESPACE/$APP_IMAGE:${{ github.sha }}" "$IMAGE_NAMESPACE/$APP_IMAGE:${{ github.ref_name }}"
          docker tag "$IMAGE_NAMESPACE/$DB_IMAGE:${{ github.sha }}" "$IMAGE_NAMESPACE/$DB_IMAGE:${{ github.ref_name }}"

      - name: Push release images
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker push "$IMAGE_NAMESPACE/$APP_IMAGE:${{ github.ref_name }}"
          docker push "$IMAGE_NAMESPACE/$DB_IMAGE:${{ github.ref_name }}"